<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SimuBank | Acceso Administrador</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <link rel="stylesheet" href="../CSS/admin-login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-header">
                <div class="brand-mark">
                    <i data-lucide="landmark"></i>
                    <span>SimuBank</span>
                </div>

                <div class="login-icon">
                    <i data-lucide="shield-check"></i>
                </div>

                <h1>Acceso administrativo</h1>

                <p>
                    Inicia sesión para administrar las funcionalidades
                    de la plataforma.
                </p>
            </div>

            <form class="login-form" action="admin-home.html">

                <div class="form-group">
                    <label for="usuario">Correo electrónico</label>

                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input
                            type="email"
                            id="usuario"
                            placeholder="admin@bankingacademy.com"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                        <button type="button" class="password-toggle" aria-label="Mostrar contraseña">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-option">
                        <input type="checkbox">
                        <span>Recordarme</span>
                    </label>

                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login">
                    <span>Iniciar sesión</span>
                    <i data-lucide="arrow-right"></i>
                </button>

            </form>

            <div class="login-footer">
                <i data-lucide="shield"></i>
                <span>Acceso protegido para usuarios autorizados</span>
            </div>

        </section>

    </main>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
